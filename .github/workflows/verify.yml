name: Verify portfolio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run evaluate:retrieval
      - run: npm test
      - run: npx tsx tests/e2e/build-artifact-check.ts
      - run: npm run build
        env:
          SITE_ORIGIN: https://nporto.com
      - run: npm run verify:dist
      - run: npx tsx tests/e2e/reproducible-build.ts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: verified-static-site
          path: |
            dist/
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
